[project]
name = "voice-clone-device"
version = "0.1.0"
description = "Real-time voice cloning virtual audio device for conferencing apps"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Audio processing
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "torchaudio>=2.0.0",

    # Speech-to-Text (for quality mode)
    "faster-whisper>=0.10.0",
    "torch>=2.0.0",
    "silero-vad>=5.1",

    # Text-to-Speech (Local Qwen3-TTS - for quality mode)
    "qwen-tts @ git+https://github.com/QwenLM/Qwen3-TTS.git",

    # Voice conversion (for fast mode)
    "librosa>=0.11.0",
    "numba>=0.60.0",

    # General
    "numpy>=1.24.0",
]

# Note: RVC dependencies have version conflicts with some packages.
# To use RVC converter, install manually after setup:
#   uv pip install rvc-python faiss-cpu praat-parselmouth

[tool.uv.sources]
qwen-tts = { git = "https://github.com/QwenLM/Qwen3-TTS.git" }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
